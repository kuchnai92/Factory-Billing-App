name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "flet[cli]"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: SUPER Fix Android Licenses
      run: |
        # 1. Manually create the license file (The "Forgery" Method)
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        
        # 2. Try to accept using the official tool (The "Standard" Method)
        yes | flutter doctor --android-licenses || true
        
        # 3. Check if it worked (Just for logs)
        flutter doctor

    - name: Build APK
      run: |
        flet build apk --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-billing-app
        path: build/apk/app-release.apk

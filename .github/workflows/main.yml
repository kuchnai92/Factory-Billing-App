name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # This line forces the update to the latest Flet version to support the --icon flag
        pip install --upgrade "flet[cli]"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Tools (The Key to Success)
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Accept Licenses (With Safety Lock)
      run: |
        # We try to accept licenses, but if it complains, we force it to continue anyway
        yes | sdkmanager --licenses || true
        yes | flutter doctor --android-licenses || true
        
        # This is the important part: We tell it NOT to crash even if it finds issues
        flutter doctor || true

    - name: Build APK
      run: |
        # Using the updated flags for your icon and product name
        flet build apk --icon assets/icon.png --product "Factory Billing" --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-billing-app
        # Path updated to catch the built APK regardless of filename
        path: build/apk/*.apk

name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Specifically installing the version that works with the current environment
        pip install flet==0.21.2
        pip install "flet[cli]"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Accept Licenses
      run: |
        yes | sdkmanager --licenses || true
        yes | flutter doctor --android-licenses || true
        flutter doctor || true

    - name: Build APK
      run: |
        # Using the standard build command but ensuring the path is local
        export PATH=$PATH:/home/runner/.local/bin
        flet build apk --icon assets/icon.png --product "Factory Billing" --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-billing-app
        path: build/apk/*.apk
